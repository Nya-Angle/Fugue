[workspace]
members = [
    "crates/fugue-core",
    "crates/fugue-kernel",
    "crates/fugue-omni",
    "crates/fugue-ui",
]
default-members = ["crates/fugue-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fugue Contributors"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 开发构建时仅对依赖开启优化：Slint 渲染/文本布局在 debug 下会明显卡顿
[profile.dev.package."*"]
opt-level = 2
