[package]
name = "fugue-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
slint = { version = "1.8", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "software-renderer-systemfonts",
    "accessibility",
] }
mimalloc = { version = "0.1", default-features = false }
sys-locale = "0.3"
fugue-core = { path = "../fugue-core" }
fugue-kernel = { path = "../fugue-kernel" }
fugue-omni = { path = "../fugue-omni" }
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
latex-rust = { version = "3.0", features = ["png"] }
arboard = "3.4"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1.8"
